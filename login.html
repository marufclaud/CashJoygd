<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CashJoy — Sign In / Sign Up</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg:#F4F4F8; --surface:#FFFFFF; --surface-2:#F7F7FB; --surface-3:#EFEFF5;
  --text:#101018; --text-2:#4A4A5A; --text-3:#8A8A9C;
  --border:rgba(18,18,38,.075);
  --brand:#FF5F1F;
}
*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh; background:var(--bg); color:var(--text);
  font-family:'Plus Jakarta Sans', system-ui, sans-serif;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
  display:grid; place-items:center; padding:24px;
}
.section-title{ font-family:'Sora',sans-serif; font-weight:800; letter-spacing:-.03em; line-height:1.05; }
.orb{ position:fixed; border-radius:50%; pointer-events:none; z-index:0; filter:blur(90px); opacity:.5; }
.orb-1{ width:520px;height:520px; top:-180px; left:-140px; background:radial-gradient(circle at 30% 30%, #FF8A3D, #FF3D6E 55%, transparent 72%); animation:drift1 26s ease-in-out infinite; }
.orb-2{ width:480px;height:480px; bottom:-180px; right:-160px; background:radial-gradient(circle at 40% 40%, #FFB27A, #FF5F1F 50%, transparent 72%); animation:drift2 32s ease-in-out infinite; }
@keyframes drift1{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,50px)} }
@keyframes drift2{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,60px)} }

.auth-wrap{ position:relative; z-index:2; width:100%; max-width:440px; }
.auth-card{
  background:var(--surface); border-radius:32px; padding:36px;
  box-shadow: 0 30px 70px -28px rgba(16,16,32,.30), 0 8px 22px -10px rgba(16,16,32,.10), inset 0 1px 0 rgba(255,255,255,.9);
  border:1px solid var(--border); position:relative;
}
.auth-card::before{
  content:''; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none;
  background:linear-gradient(140deg, rgba(255,95,31,.22), transparent 42%);
  padding:1px; -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; opacity:.5;
}
.input{
  width:100%; padding:14px 16px 14px 44px; border-radius:15px; font-size:14px; font-weight:600;
  background:var(--surface-2); border:1px solid var(--border); color:var(--text); outline:none;
  transition:all .35s cubic-bezier(.2,.8,.2,1); font-family:inherit;
}
.input:focus{ border-color:rgba(255,95,31,.5); box-shadow:0 0 0 4px rgba(255,95,31,.12); background:#fff; }
.input::placeholder{ color:var(--text-3); font-weight:500; }
.input-wrap{ position:relative; }
.input-wrap svg.lead{ position:absolute; left:15px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--text-3); pointer-events:none; }
.input-wrap .toggle-pw{ position:absolute; right:12px; top:50%; transform:translateY(-50%); width:32px; height:32px; display:grid; place-items:center; cursor:pointer; border-radius:9px; color:var(--text-3); border:none; background:transparent; }
.input-wrap .toggle-pw:hover{ background:var(--surface-3); color:var(--text); }
.btn{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-weight:700; font-size:14px; border-radius:15px; padding:14px 18px; cursor:pointer;
  border:1px solid transparent; transition:all .4s cubic-bezier(.2,.8,.2,1); width:100%; font-family:inherit; }
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.6; cursor:not-allowed; }
.btn-primary{ color:#fff; background:linear-gradient(130deg,#FF8A3D 0%, #FF5F1F 45%, #EE3D00 100%);
  box-shadow:0 12px 26px -10px rgba(255,95,31,.80), inset 0 1px 0 rgba(255,255,255,.35); }
.btn-primary:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 20px 38px -12px rgba(255,95,31,.9); }
.social-btn{ width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  padding:13px; border-radius:15px; background:var(--surface); border:1px solid var(--border);
  font-size:13.5px; font-weight:700; color:var(--text); cursor:pointer;
  transition:all .4s cubic-bezier(.2,.8,.2,1); font-family:inherit; }
.social-btn:hover{ transform:translateY(-2px); border-color:rgba(255,95,31,.35); box-shadow: 0 12px 24px -12px rgba(16,16,32,.28); }
.tab-switch{ display:flex; gap:4px; padding:5px; border-radius:16px; background:var(--surface-2); margin-bottom:24px; }
.tab-switch button{ flex:1; padding:10px 14px; border-radius:12px; font-size:13px; font-weight:700;
  color:var(--text-3); background:transparent; border:none; cursor:pointer; font-family:inherit;
  transition:all .35s cubic-bezier(.2,.8,.2,1); }
.tab-switch button.active{ color:#fff; background:linear-gradient(120deg,#FF8A3D,#FF5F1F);
  box-shadow:0 8px 18px -8px rgba(255,95,31,.9), inset 0 1px 0 rgba(255,255,255,.3); }
.divider-line{ display:flex; align-items:center; gap:12px; margin:22px 0; }
.divider-line::before, .divider-line::after{ content:''; height:1px; flex:1; background:var(--border); }
.divider-line span{ font-size:11px; font-weight:800; letter-spacing:.08em; color:var(--text-3); }
.toast{ position:fixed; top:24px; left:50%; transform:translate(-50%,-120%);
  padding:14px 20px; border-radius:14px; font-size:13.5px; font-weight:700; color:#fff;
  box-shadow:0 14px 30px -10px rgba(16,16,32,.45); z-index:200;
  transition:transform .5s cubic-bezier(.16,1,.3,1); display:flex; align-items:center; gap:10px; max-width:92vw; }
.toast.show{ transform:translate(-50%,0); }
.toast.error{ background:linear-gradient(130deg,#F43F5E,#BE123C); }
.toast.success{ background:linear-gradient(130deg,#22C55E,#15803D); }
.toast svg{ width:18px; height:18px; flex-shrink:0; }
.field-error{ color:#E11D48; font-size:11.5px; font-weight:700; margin-top:6px; display:none; }
.field-error.show{ display:block; }
.spin{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-wrap">

  <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px">
    <div style="width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
                background:linear-gradient(150deg,#FF9A5A 0%, #FF5F1F 48%, #F03E00 100%);
                box-shadow:0 14px 26px -10px rgba(255,95,31,.65), inset 0 1px 0 rgba(255,255,255,.4)">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M9.5 8.5L12 6.5l2.5 2M12 17.5V6.5"/>
        <path d="M8.5 12.5h7M8.5 14.5h7"/>
      </svg>
    </div>
    <span class="section-title" style="font-size:24px;color:#2D2D3A">
      Cash<span style="background:linear-gradient(135deg,#FF8A3D,#FF5F1F);-webkit-background-clip:text;background-clip:text;color:transparent">Joy</span>
    </span>
  </div>

  <div class="auth-card">

    <div class="tab-switch">
      <button id="tabSignIn" class="active">Sign In</button>
      <button id="tabSignUp">Sign Up</button>
    </div>

    <div style="text-align:center;margin-bottom:24px">
      <h1 id="formTitle" class="section-title" style="font-size:26px">Welcome back</h1>
      <p id="formSubtitle" style="font-size:13.5px;font-weight:500;margin-top:8px;color:var(--text-2)">Sign in to continue earning.</p>
    </div>

    <form id="authForm" style="display:flex;flex-direction:column;gap:14px" novalidate>

      <div id="nameField" style="display:none">
        <div class="input-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="nameInput" class="input" placeholder="Full name" autocomplete="name" />
        </div>
        <div class="field-error" id="errName"></div>
      </div>

      <div>
        <div class="input-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 7 10-7"/></svg>
          <input type="email" id="emailInput" class="input" placeholder="Email address" autocomplete="email" required />
        </div>
        <div class="field-error" id="errEmail"></div>
      </div>

      <div>
        <div class="input-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="pwInput" class="input" placeholder="Password" autocomplete="current-password" required />
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-error" id="errPw"></div>
      </div>

      <div id="forgotRow" style="display:flex;justify-content:flex-end">
        <a href="#" id="forgotLink" style="font-size:12.5px;font-weight:700;color:var(--brand)">Forgot password?</a>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top:6px">
        <span id="submitLabel">Sign In</span>
      </button>
    </form>

    <div class="divider-line"><span>OR CONTINUE WITH</span></div>

    <button type="button" id="googleBtn" class="social-btn">
      <svg viewBox="0 0 48 48" style="width:20px;height:20px"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.3 4.1-4.1 5.5l6.2 5.2C36.9 39.1 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <p style="text-align:center;font-size:11.5px;font-weight:600;margin-top:24px;color:var(--text-3)">
      By continuing, you agree to our <a href="#" style="color:var(--text-2);text-decoration:underline">Terms</a> &amp; <a href="#" style="color:var(--text-2);text-decoration:underline">Privacy Policy</a>
    </p>
  </div>

  <div style="text-align:center;margin-top:24px">
    <a href="index.html" style="font-size:13px;font-weight:700;color:var(--text-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Back to home
    </a>
  </div>
</div>

<div id="toast" class="toast">
  <svg id="toastIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></svg>
  <span id="toastMsg">Message</span>
</div>

<script type="module">
import {
  auth, db, provider,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInWithPopup,
  onAuthStateChanged,
  updateProfile,
  sendPasswordResetEmail,
  createUserDoc,
  findUserByReferralCode
} from './firebase-config.js';

const urlRef = new URLSearchParams(location.search).get('ref');
if (urlRef){
  sessionStorage.setItem('cj-ref', urlRef);
  const sub = document.getElementById('formSubtitle');
  if (sub) sub.textContent = '🎁 You were invited! Sign up to claim your bonus.';
}

onAuthStateChanged(auth, (user) => {
  if (user){
    setTimeout(() => { window.location.href = 'index.html'; }, 300);
  }
});

window.cjAuth = {
  auth, db, provider,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInWithPopup,
  updateProfile,
  sendPasswordResetEmail,
  createUserDoc,
  findUserByReferralCode
};

window.dispatchEvent(new Event('cj-firebase-ready'));
</script>

<script>
const $ = (s) => document.querySelector(s);
let mode = 'signin';

function setMode(next){
  mode = next;
  const isSignUp = mode === 'signup';
  $('#tabSignIn').classList.toggle('active', !isSignUp);
  $('#tabSignUp').classList.toggle('active', isSignUp);
  $('#nameField').style.display = isSignUp ? 'block' : 'none';
  $('#forgotRow').style.display = isSignUp ? 'none' : 'flex';
  $('#formTitle').textContent = isSignUp ? 'Create your account' : 'Welcome back';
  $('#formSubtitle').textContent = isSignUp ? 'Sign up free — start earning in 30 seconds.' : 'Sign in to continue earning.';
  $('#submitLabel').textContent = isSignUp ? 'Create account' : 'Sign In';
  $('#pwInput').setAttribute('autocomplete', isSignUp ? 'new-password' : 'current-password');
  clearErrors();
}

$('#tabSignIn').addEventListener('click', () => setMode('signin'));
$('#tabSignUp').addEventListener('click', () => setMode('signup'));

$('#togglePw').addEventListener('click', () => {
  const p = $('#pwInput');
  p.type = p.type === 'password' ? 'text' : 'password';
});

let toastTimer;
function showToast(msg, type='success'){
  const t = $('#toast');
  t.className = 'toast show ' + type;
  $('#toastMsg').textContent = msg;
  $('#toastIcon').innerHTML = type === 'success'
    ? '<polyline points="20 6 9 17 4 12"/>'
    : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

function setErr(id, msg){
  const e = document.getElementById(id);
  if (!e) return;
  if (msg){ e.textContent = msg; e.classList.add('show'); }
  else { e.textContent = ''; e.classList.remove('show'); }
}
function clearErrors(){ ['errName','errEmail','errPw'].forEach(id => setErr(id, '')); }

function friendlyError(code){
  const map = {
    'auth/email-already-in-use': 'এই ইমেইল দিয়ে অ্যাকাউন্ট আগেই আছে। Sign In করো।',
    'auth/invalid-email': 'ইমেইল অ্যাড্রেস সঠিক নয়।',
    'auth/weak-password': 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।',
    'auth/user-not-found': 'এই ইমেইলে কোনো অ্যাকাউন্ট নেই।',
    'auth/wrong-password': 'পাসওয়ার্ড ভুল।',
    'auth/invalid-credential': 'ইমেইল বা পাসওয়ার্ড ভুল।',
    'auth/too-many-requests': 'অনেকবার চেষ্টা হয়েছে। একটু পরে আবার চেষ্টা করো।',
    'auth/popup-closed-by-user': 'Google popup বন্ধ হয়ে গেছে।',
    'auth/popup-blocked': 'Browser popup block করেছে। Allow করো।',
    'auth/network-request-failed': 'নেটওয়ার্ক সমস্যা — ইন্টারনেট চেক করো।',
  };
  return map[code] || 'কিছু একটা ভুল হয়েছে। আবার চেষ্টা করো।';
}

$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!window.cjAuth){
    showToast('Firebase এখনো load হয়নি, একটু অপেক্ষা করো।', 'error');
    return;
  }
  clearErrors();

  const {
    auth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    updateProfile, createUserDoc, findUserByReferralCode
  } = window.cjAuth;

  const name = $('#nameInput').value.trim();
  const email = $('#emailInput').value.trim();
  const pw = $('#pwInput').value;

  let ok = true;
  if (mode === 'signup' && name.length < 2){ setErr('errName','তোমার নাম লিখো।'); ok = false; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ setErr('errEmail','সঠিক ইমেইল দাও।'); ok = false; }
  if (pw.length < 6){ setErr('errPw','কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দাও।'); ok = false; }
  if (!ok) return;

  const btn = $('#submitBtn');
  const label = $('#submitLabel');
  const original = label.textContent;
  btn.disabled = true;
  label.innerHTML = '<svg class="spin" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg> Please wait…';

  try {
    if (mode === 'signup'){
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      const user = cred.user;
      await updateProfile(user, { displayName: name });

      let referredBy = null;
      const refCode = new URLSearchParams(location.search).get('ref') || sessionStorage.getItem('cj-ref');
      if (refCode){
        const referrer = await findUserByReferralCode(refCode);
        if (referrer) referredBy = referrer.uid;
      }

      await createUserDoc(user, { name, referredBy });
      sessionStorage.removeItem('cj-ref');
      showToast('✅ অ্যাকাউন্ট তৈরি হয়েছে! Dashboard এ যাচ্ছি…', 'success');
    } else {
      await signInWithEmailAndPassword(auth, email, pw);
      showToast('✅ স্বাগতম! Dashboard এ যাচ্ছি…', 'success');
    }

    setTimeout(() => { window.location.href = 'index.html'; }, 1100);

  } catch (err){
    console.error(err);
    showToast(friendlyError(err.code), 'error');
    btn.disabled = false;
    label.textContent = original;
  }
});

$('#googleBtn').addEventListener('click', async () => {
  if (!window.cjAuth){
    showToast('Firebase এখনো load হয়নি, একটু অপেক্ষা করো।', 'error');
    return;
  }

  const { auth, provider, signInWithPopup, createUserDoc, findUserByReferralCode } = window.cjAuth;

  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    let referredBy = null;
    const refCode = new URLSearchParams(location.search).get('ref') || sessionStorage.getItem('cj-ref');
    if (refCode){
      const referrer = await findUserByReferralCode(refCode);
      if (referrer) referredBy = referrer.uid;
    }

    await createUserDoc(user, { referredBy });
    sessionStorage.removeItem('cj-ref');
    showToast('✅ Google দিয়ে সাইন ইন সফল!', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 900);

  } catch (err){
    console.error(err);
    showToast(friendlyError(err.code), 'error');
  }
});

$('#forgotLink').addEventListener('click', async (e) => {
  e.preventDefault();

  const email = prompt('Enter your email address to reset password:');
  if (!email) return;

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showToast('সঠিক ইমেইল দাও।', 'error');
    return;
  }

  try {
    const { sendPasswordResetEmail, auth } = window.cjAuth;
    await sendPasswordResetEmail(auth, email);
    showToast('📧 Password reset email পাঠানো হয়েছে! Spam folder ও দেখো।', 'success');
  } catch (err){
    console.error(err);
    showToast(friendlyError(err.code), 'error');
  }
});
</script>
</body>
</html>
